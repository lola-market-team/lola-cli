# Publishes @lola-market/cli to npm when a GitHub release is published.
# Uses npm trusted publishing (OIDC). No NPM_TOKEN secret: configure the
# trusted publisher for this repo + workflow on npmjs.com first.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - name: Tag must match package version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
      - run: npm publish --provenance --access public
